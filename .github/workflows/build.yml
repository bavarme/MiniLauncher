name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: |
          gradle assembleDebug --no-daemon 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Show errors on the run page
        if: failure()
        run: |
          {
            echo "## Ошибки сборки"
            echo ""
            echo '```'
            grep -E "^e: |FAILED|What went wrong" -A4 build.log | head -200
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Каждая ошибка компиляции отдельной аннотацией с путём и строкой.
          # Аннотации видны на странице запуска и через API (check-runs/.../annotations).
          grep -E "^e: " build.log | head -60 | sed -E 's#^e: file://[^ ]*/(app/src/[^:]*):([0-9]+):([0-9]+) (.*)$#::error file=\1,line=\2,col=\3::\4#; t; s#^e: (.*)$#::error::\1#'
          grep -A3 "What went wrong" build.log | head -20 | sed -E 's#^(.*)$#::error::\1#' || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiniLauncher-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
